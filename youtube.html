<!DOCTYPE html>

<html>
    <head>
     <title>
        YoutTube.com Clone
     </title>

     <link rel="preconnect" href="https://fonts.googleapis.com">
     <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
     <link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght,XOPQ,XTRA,YOPQ,YTDE,YTFI,YTLC,YTUC@8..144,100..1000,96,468,79,-203,738,514,712&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

     <style>

        p{
            font-family: Roboto, Arial;
            margin-top: 0;
            margin-bottom: 0;
        }
        .thumbanail{
            width: 300px;
            display: block;
        }
        .search-bar{
            display: block;
        }

        .video-preview{
            width: 300px;
            display: inline-block;
            vertical-align: top;
            margin-right: 15px;
        }

        .video-title{
            margin-top: 0;
            font-size: 14px;
            font-weight: 500;
            line-height: 20px;
            margin-bottom: 12px;
        }

        .channel-pic{
            display: inline-block;
            width: 50px;
            vertical-align: top;
        }

        .video-info{
            display: inline-block;
            width: 200px;
        }

        .profile-pic{
            width: 40px;
            border-radius: 50px;

        }
        .thumbanail-row{
            margin-bottom: 12px;
        }
        
        .video-stats,
        .video-author{
            font-size : 12px;
            color: rgb(96,96,96);
        }

        .video-author{
            margin-bottom: 4px;
        }


        
     </style>
    </head>

    <body>

        <input class = "search-bar" type = "text" placeholder="Search">
        
        
        <div class="video-preview">
            
            <div class = "thumbanail-row">
                <img class = "thumbanail" src = "thumbnails/thumbnail-1.webp">

            </div>

            <div>
                <div class = "channel-pic">
                    <img class = "profile-pic" src = "channel-pictures/channel-1.jpeg" >

                </div>

                <div class = "video-info">
                    <p class = "video-title">
                      Talking Tech and AI with Google CEO Sundar Pichai!
                    </p>

                    <p class ="video-author">
                      Marques Brownlee
                    </p>

                    <p class = "video-stats">
                      3.8M Views &middot; 6 months ago
                    </p>

                </div>
                               
            </div>
                         
        </div>


        <div class="video-preview">
            
            <div class = "thumbanail-row">
                <img class = "thumbanail" src = "thumbnails/thumbnail-2.webp">

            </div>

            <div>
                <div class = "channel-pic">
                    <img class = "profile-pic" src = "channel-pictures/channel-2.jpeg" >

                </div>

                <div class = "video-info">
                    <p class = "video-title">                      
                      Try Not To Laugh Challenge #9
                    </p>

                    <p class ="video-author">
                      Markiplier
                    </p>

                    <p class = "video-stats">
                      19M Views &middot; 4 years ago
                    </p>

                </div>
                               
            </div>
                         
        </div>

    </body>
</html>
